<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamer Countdown Calendar</title>
<style>
  body {
    font-family: 'Orbitron', Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
  }
  h1 {
    text-align: center;
    font-size: 2.5rem;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff;
    margin-bottom: 20px;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 50px);
    gap: 5px;
    margin-bottom: 30px;
  }
  .day {
    width: 50px;
    height: 50px;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 0 5px #0ff;
    color: #fff;
    text-shadow: 0 0 3px #0ff;
  }
  .day.past {
    background: #222;
    color: #aaa;
    box-shadow: none;
    text-shadow: none;
  }
  .day.current {
    background: #0ff;
    color: #000;
    box-shadow: 0 0 15px #0ff, 0 0 25px #0ff;
    text-shadow: 0 0 5px #000;
  }
  .circle-container {
    display: flex;
    gap: 20px;
  }
  .circle {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: conic-gradient(#0ff 0deg, #0ff 0deg, #222 0deg, #222 360deg);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.4rem;
    color: #fff;
    text-shadow: 0 0 5px #000;
    box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
  }
  .label {
    position: absolute;
    bottom: 8px;
    font-size: 0.8rem;
    color: #fff;
    text-shadow: 0 0 5px #000;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<h1>30-Day Countdown</h1>

<div class="calendar" id="calendar"></div>

<div class="circle-container">
  <div class="circle" id="hoursCircle"><span id="hours">0</span><div class="label">Hours</div></div>
  <div class="circle" id="minutesCircle"><span id="minutes">0</span><div class="label">Minutes</div></div>
  <div class="circle" id="secondsCircle"><span id="seconds">0</span><div class="label">Seconds</div></div>
</div>

<script>
  const startDate = new Date();
  const countdownDate = new Date();
  countdownDate.setDate(countdownDate.getDate() + 30);

  function buildCalendar() {
    const calendar = document.getElementById('calendar');
    calendar.innerHTML = '';
    for (let i = 1; i <= 30; i++) {
      const day = document.createElement('div');
      day.className = 'day';
      day.innerText = i;
      calendar.appendChild(day);
    }
  }

  function updateCalendar() {
    const now = new Date();
    const diffDays = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
    const dayElements = document.querySelectorAll('.day');
    dayElements.forEach((day, index) => {
      day.classList.remove('past', 'current');
      if (index < diffDays) day.classList.add('past');
      else if (index === diffDays) day.classList.add('current');
    });
  }

  function updateClockUI() {
    const now = new Date().getTime();
    const distance = countdownDate - now;

    if (distance < 0) return;

    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;

    document.getElementById("hoursCircle").style.background = `conic-gradient(#0ff ${(hours/24)*360}deg, #222 0deg)`;
    document.getElementById("minutesCircle").style.background = `conic-gradient(#0ff ${(minutes/60)*360}deg, #222 0deg)`;
    document.getElementById("secondsCircle").style.background = `conic-gradient(#0ff ${(seconds/60)*360}deg, #222 0deg)`;
  }

  buildCalendar();
  setInterval(() => {
    updateCalendar();
    updateClockUI();
  }, 1000);
</script>

</body>
</html>
